services:
  backend:
    build:
      context: ./backend
    expose:
      - "8000"
    volumes:
      - hello-world-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hello-world-data:
